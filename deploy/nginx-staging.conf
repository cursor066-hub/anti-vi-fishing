# REVIEW TEMPLATE ONLY: invariant.internal and certificate paths need an assigned
# customer staging environment. Start the app with --origin https://invariant.internal.
# Never expose the engineering service to untrusted public traffic.
server {
    listen 443 ssl;
    server_name invariant.internal;
    ssl_certificate /etc/invariant/tls/fullchain.pem;
    ssl_certificate_key /etc/invariant/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host invariant.internal;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
    }
}
